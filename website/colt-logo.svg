<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="coltGradient" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F4A261" />
      <stop offset="50%" stop-color="#E07A5F" />
      <stop offset="100%" stop-color="#D94E34" />
    </linearGradient>
    <linearGradient id="coltDarkGlow" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1F2937" />
      <stop offset="100%" stop-color="#0F141C" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#E07A5F" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Hex Shield with Subtle Rim -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#coltDarkGlow)" stroke="#2D3748" stroke-width="2"/>

  <!-- Geometric C / Data Prism Shape -->
  <path d="M 76 34 
           L 46 34 
           C 36 34 28 42 28 52 
           L 28 68 
           C 28 78 36 86 46 86 
           L 76 86 
           L 76 72 
           L 48 72 
           C 44 72 42 70 42 66 
           L 42 54 
           C 42 50 44 48 48 48 
           L 76 48 
           Z" 
        fill="url(#coltGradient)" 
        filter="url(#softGlow)"/>

  <!-- Forward-firing Data Pulse Accents -->
  <polygon points="82,42 94,50 82,58" fill="#F4A261" opacity="0.95"/>
  <polygon points="86,62 98,70 86,78" fill="#E07A5F" opacity="0.8"/>
  <circle cx="58" cy="60" r="4.5" fill="#FFFFFF" opacity="0.9"/>
</svg>
