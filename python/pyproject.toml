[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coltane"
version = "0.1.0"
description = "Python client and query builder for ColtaneDB and ColtLang"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [
  { name = "ColtaneDB Team", email = "info.cometlabs@gmail.com" }
]
keywords = ["colt", "coltanedb", "database", "query-language", "postgres", "vector"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
]

[project.urls]
Homepage = "https://github.com/itsjustayush/coltanedb"
Documentation = "https://github.com/itsjustayush/coltanedb#readme"
Repository = "https://github.com/itsjustayush/coltanedb.git"

[project.scripts]
colt = "coltane.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["coltane*"]
