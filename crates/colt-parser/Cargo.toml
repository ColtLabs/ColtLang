[package]
name = "colt-parser"
version = "0.2.0"
edition = "2021"
description = "Normative recursive-descent and Pratt parser for ColtLang"
authors = ["ColtLabs"]
license = "MIT"

[dependencies]
colt-span = { path = "../colt-span" }
colt-diagnostics = { path = "../colt-diagnostics" }
colt-ast = { path = "../colt-ast" }
colt-lexer = { path = "../colt-lexer" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
