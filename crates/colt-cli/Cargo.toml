[package]
name = "colt-cli"
version = "0.2.0"
edition = "2021"
description = "High-performance native command-line interface for ColtLang"
authors = ["ColtLabs"]
license = "MIT"

[[bin]]
name = "colt"
path = "src/main.rs"

[dependencies]
colt-span = { path = "../colt-span" }
colt-diagnostics = { path = "../colt-diagnostics" }
colt-ast = { path = "../colt-ast" }
colt-lexer = { path = "../colt-lexer" }
colt-parser = { path = "../colt-parser" }
colt-compiler = { path = "../colt-compiler" }
colt-fmt = { path = "../colt-fmt" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
