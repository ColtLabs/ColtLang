name: Publish Python Package to PyPI

on:
  push:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Required for PyPI Trusted Publishing (OIDC)

jobs:
  pypi-publish:
    name: Build, test, and publish distribution packages to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Run Python SDK tests
        run: |
          pip install -e .
          python -m unittest discover -s tests -v
        working-directory: packages/python/coltanedb

      - name: Build sdist and wheel
        run: python -m build
        working-directory: packages/python/coltanedb

      - name: Verify package distributions with twine
        run: twine check dist/*
        working-directory: packages/python/coltanedb

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/coltanedb/dist/
          skip-existing: true
