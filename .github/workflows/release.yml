name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: colt.exe
            asset_name: colt-windows-x86_64.zip
            archive_type: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: colt
            asset_name: colt-linux-x86_64.tar.gz
            archive_type: tar
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: colt
            asset_name: colt-macos-aarch64.tar.gz
            archive_type: tar
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: colt
            asset_name: colt-macos-x86_64.tar.gz
            archive_type: tar

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release -p colt-cli --target ${{ matrix.target }}

      - name: Package Windows Artifact (zip)
        if: matrix.archive_type == 'zip'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.asset_name }} ${{ matrix.artifact_name }}

      - name: Package Unix Artifact (tar.gz)
        if: matrix.archive_type == 'tar'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.asset_name }} ${{ matrix.artifact_name }}

      - name: Upload Build Asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    name: Publish Release & Checksum Manifest
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
            release-assets/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
