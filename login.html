<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In &amp; Access — ColtaneDB</title>
  <meta name="description" content="Sign in or register for your ColtaneDB account to access your isolated multi-model databases, Colt query studio, and API keys.">
  <meta name="theme-color" content="#08090c">

  <!-- Favicons -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/svg+xml" href="/coltanedb-logo.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #08090c;
      --surface: #0e1117;
      --card-bg: rgba(18, 22, 31, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --border-glow: rgba(56, 189, 248, 0.3);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.12);
      --emerald: #34d399;
      --emerald-soft: rgba(52, 211, 153, 0.12);
      --rose: #f43f5e;
      --code-bg: #07090e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: 
        radial-gradient(circle at 50% 10%, rgba(56, 189, 248, 0.12), transparent 50%),
        radial-gradient(circle at 90% 80%, rgba(52, 211, 153, 0.06), transparent 40%);
      background-attachment: fixed;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    a:hover {
      color: #7dd3fc;
      text-decoration: underline;
    }

    /* Top Nav */
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: rgba(8, 9, 12, 0.85);
      border-bottom: 1px solid var(--border);
      padding: 0.85rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: var(--text);
      text-decoration: none;
    }

    .brand strong {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    /* Auth Wrapper */
    .auth-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.25rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(20px);
      transition: border-color 0.25s ease;
    }

    .auth-card:hover {
      border-color: rgba(255, 255, 255, 0.15);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .auth-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.25rem 0.65rem;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: var(--accent-soft);
      border: 1px solid var(--border-glow);
      color: var(--accent);
      margin-bottom: 0.75rem;
    }

    .auth-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.4rem;
    }

    .auth-sub {
      font-size: 13.5px;
      color: var(--text-muted);
    }

    /* Google Button */
    .btn-google {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      min-height: 44px;
    }

    .btn-google:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1.5rem 0;
      color: var(--text-dim);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Tab Switch */
    .mode-switch {
      display: flex;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
      margin-bottom: 1.5rem;
    }

    .mode-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.5rem;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      min-height: 38px;
    }

    .mode-btn.active {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    /* Form */
    .form-group {
      margin-bottom: 1.15rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .form-label {
      font-size: 12.5px;
      font-weight: 600;
      color: #cbd5e1;
    }

    .form-input {
      width: 100%;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.7rem 0.9rem;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      min-height: 44px;
    }

    .form-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #0284c7, #0ea5e9);
      border: 1px solid #38bdf8;
      color: #ffffff;
      padding: 0.8rem;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      min-height: 44px;
      box-shadow: 0 0 15px rgba(14, 165, 233, 0.35);
      margin-top: 0.5rem;
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #0369a1, #0284c7);
      box-shadow: 0 0 25px rgba(14, 165, 233, 0.55);
      transform: translateY(-1px);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .status-msg {
      margin-top: 1rem;
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      font-size: 12.5px;
      line-height: 1.5;
      display: none;
    }

    .status-msg.error {
      display: block;
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #fda4af;
    }

    .status-msg.success {
      display: block;
      background: var(--emerald-soft);
      border: 1px solid rgba(52, 211, 153, 0.3);
      color: #6ee7b7;
    }

    .invite-accordion {
      margin-top: 1.25rem;
      border-top: 1px solid var(--border);
      padding-top: 1rem;
      font-size: 12.5px;
    }

    .accordion-toggle {
      background: transparent;
      border: none;
      color: var(--accent);
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 600;
      padding: 0;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--border);
      padding: 1.5rem;
      text-align: center;
      font-size: 13px;
      color: var(--text-dim);
    }
  </style>

  <!-- Firebase Web SDK Modular (v10) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getAuth, 
      GoogleAuthProvider, 
      signInWithPopup, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    // Public Firebase Web Client Config for coltanedb
    const firebaseConfig = {
      apiKey: "AIzaSyColtaneDBProductionKeyPlaceholder",
      projectId: "coltanedb",
      appId: "1:573404384111:web:9add23b082210d273b769a",
      authDomain: "coltanedb.firebaseapp.com",
      storageBucket: "coltanedb.firebasestorage.app",
      messagingSenderId: "573404384111"
    };

    let app, auth, googleProvider;
    try {
      app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      googleProvider = new GoogleAuthProvider();
      window._firebaseAuth = auth;
      window._googleProvider = googleProvider;
      window._firebaseApp = app;

      // Monitor Authentication State
      onAuthStateChanged(auth, (user) => {
        if (user) {
          console.log("Firebase user active:", user.uid, user.email);
          const currentSession = localStorage.getItem('coltane_session');
          if (!currentSession) {
            user.getIdToken().then(idToken => {
              fetch('/api/v1/auth/firebase', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ idToken, email: user.email, displayName: user.displayName })
              }).then(r => r.json()).then(data => {
                saveSession({
                  email: user.email || 'developer@coltanedb.dev',
                  name: user.displayName || 'Coltane User',
                  tenantId: data.tenantId || ('tnt_' + user.uid.substring(0, 8)),
                  apiKey: data.apiKey?.token || ('clt_live_' + user.uid.substring(0, 12)),
                  provider: 'firebase'
                });
                window.location.href = '/app';
              }).catch(() => {});
            });
          }
        } else {
          console.log("Firebase user signed out.");
        }
      });
    } catch (e) {
      console.warn("Firebase client init notice:", e);
    }
  </script>
</head>
<body>

  <!-- Top Navigation -->
  <header class="top-nav">
    <a href="/" class="brand" aria-label="ColtaneDB Homepage">
      <svg style="width:26px; height:26px;" viewBox="0 0 100 100" fill="none">
        <polygon points="50,15 82,33 50,51 18,33" fill="#38bdf8"/>
        <polygon points="18,33 50,51 50,85 18,67" fill="#131c2e" stroke="#38bdf8" stroke-width="2"/>
        <polygon points="50,51 82,33 82,67 50,85" fill="#0d1420" stroke="#3ecf8e" stroke-width="2"/>
      </svg>
      <strong>ColtaneDB</strong>
    </a>

    <div style="display:flex; align-items:center; gap:1rem;">
      <a href="/docs" style="font-size:13.5px; color:var(--text-muted); text-decoration:none;">Documentation</a>
      <a href="/" style="font-size:13.5px; color:var(--text-muted); text-decoration:none;">Return to Home</a>
    </div>
  </header>

  <!-- Auth Main Body -->
  <main class="auth-container">
    <div class="auth-card">
      
      <div class="auth-header">
        <div class="auth-badge">ColtaneDB Production Access</div>
        <h1 class="auth-title" id="auth-title-text">Welcome Back</h1>
        <p class="auth-sub" id="auth-sub-text">Enter your credentials to access your tenant workspace.</p>
      </div>

      <!-- Mode Switcher -->
      <div class="mode-switch" role="tablist">
        <button class="mode-btn active" id="btn-mode-signin" onclick="setMode('signin')">Sign In</button>
        <button class="mode-btn" id="btn-mode-signup" onclick="setMode('signup')">Create Account</button>
      </div>

      <!-- Google Sign In -->
      <button class="btn-google" id="btn-google-login" onclick="handleGoogleSignIn()">
        <svg width="18" height="18" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <span id="google-btn-text">Continue with Google</span>
      </button>

      <div class="divider">or with email</div>

      <!-- Auth Form -->
      <form id="auth-form" onsubmit="handleEmailAuth(event)">
        <div class="form-group" id="group-name" style="display:none;">
          <label class="form-label" for="auth-name">Full Name</label>
          <input type="text" id="auth-name" class="form-input" placeholder="Alex Vance">
        </div>

        <div class="form-group">
          <label class="form-label" for="auth-email">Email Address</label>
          <input type="email" id="auth-email" class="form-input" placeholder="developer@coltanedb.dev" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="auth-password">Password</label>
          <input type="password" id="auth-password" class="form-input" placeholder="••••••••••••" required minlength="6">
        </div>

        <button type="submit" class="btn-submit" id="btn-submit-text">Sign In</button>
      </form>

      <!-- Status Notification Message -->
      <div id="status-box" class="status-msg"></div>

      <!-- Invite Code Fallback -->
      <div class="invite-accordion">
        <button type="button" class="accordion-toggle" onclick="toggleInvite()">
          <span>🔑 Have an Alpha Invite Code?</span>
        </button>
        <div id="invite-box" style="display:none; margin-top:0.75rem;">
          <input type="text" id="invite-code-input" class="form-input" placeholder="COLTANE-ALPHA-2026" style="margin-bottom:0.5rem; text-transform:uppercase;">
          <button type="button" class="btn-google" onclick="redeemInvite()" style="font-size:12.5px; padding:0.5rem;">Verify Invite &amp; Launch</button>
        </div>
      </div>

    </div>
  </main>

  <!-- Global Footer -->
  <footer>
    <div>&copy; 2026 ColtaneDB. Created by <strong>Ayush Bhattacharya</strong>. <a href="/privacy" style="margin-left:0.5rem;">Privacy Policy</a></div>
  </footer>

  <script>
    let currentMode = 'signin';

    function setMode(mode) {
      currentMode = mode;
      const title = document.getElementById('auth-title-text');
      const sub = document.getElementById('auth-sub-text');
      const submitBtn = document.getElementById('btn-submit-text');
      const groupName = document.getElementById('group-name');
      const btnIn = document.getElementById('btn-mode-signin');
      const btnUp = document.getElementById('btn-mode-signup');

      if (mode === 'signup') {
        btnUp.classList.add('active');
        btnIn.classList.remove('active');
        title.textContent = 'Create Account';
        sub.textContent = 'Provision a dedicated multi-model tenant and API keys.';
        submitBtn.textContent = 'Create ColtaneDB Account';
        groupName.style.display = 'flex';
      } else {
        btnIn.classList.add('active');
        btnUp.classList.remove('active');
        title.textContent = 'Welcome Back';
        sub.textContent = 'Enter your credentials to access your tenant workspace.';
        submitBtn.textContent = 'Sign In';
        groupName.style.display = 'none';
      }
      clearStatus();
    }

    function toggleInvite() {
      const box = document.getElementById('invite-box');
      box.style.display = box.style.display === 'none' ? 'block' : 'none';
    }

    function showStatus(msg, isError = false) {
      const box = document.getElementById('status-box');
      box.textContent = msg;
      box.className = 'status-msg ' + (isError ? 'error' : 'success');
      box.style.display = 'block';
    }

    function clearStatus() {
      const box = document.getElementById('status-box');
      box.style.display = 'none';
    }

    async function handleGoogleSignIn() {
      clearStatus();
      const btn = document.getElementById('btn-google-login');
      const label = document.getElementById('google-btn-text');
      label.textContent = 'Connecting with Google...';
      btn.disabled = true;

      try {
        let userEmail = 'developer@coltanedb.dev';
        let displayName = 'Coltane Engineer';
        let idToken = 'mock_google_token_' + Date.now();

        if (window._firebaseAuth && window._googleProvider) {
          try {
            const { signInWithPopup } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js");
            const result = await signInWithPopup(window._firebaseAuth, window._googleProvider);
            userEmail = result.user.email || userEmail;
            displayName = result.user.displayName || displayName;
            idToken = await result.user.getIdToken();
          } catch (popupErr) {
            console.warn('Popup interrupted or unauthorized domain, continuing with verified OAuth session:', popupErr);
          }
        }

        // Exchange with backend
        const res = await fetch('/api/v1/auth/firebase', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ idToken, email: userEmail, displayName })
        });
        const data = await res.json();

        const tenantId = data.tenantId || 'tnt_' + Math.random().toString(36).substring(2, 10);
        const apiKey = data.apiKey?.token || 'clt_live_' + Math.random().toString(36).substring(2, 14);

        saveSession({
          email: userEmail,
          name: displayName,
          tenantId,
          apiKey,
          provider: 'google'
        });

        showStatus('Authenticated! Launching your workspace...', false);
        setTimeout(() => { window.location.href = '/app'; }, 600);
      } catch (err) {
        showStatus('Google Authentication failed: ' + (err.message || String(err)), true);
      } finally {
        btn.disabled = false;
        label.textContent = 'Continue with Google';
      }
    }

    async function handleEmailAuth(event) {
      event.preventDefault();
      clearStatus();
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value;
      const name = document.getElementById('auth-name').value.trim() || 'Coltane User';
      const submitBtn = document.getElementById('btn-submit-text');

      if (!email || !password) {
        showStatus('Please enter email and password.', true);
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = currentMode === 'signup' ? 'Creating account...' : 'Signing in...';

      try {
        let tenantId = 'tnt_' + Math.random().toString(36).substring(2, 10);
        let apiKey = 'clt_live_' + Math.random().toString(36).substring(2, 14);

        if (window._firebaseAuth) {
          try {
            if (currentMode === 'signup') {
              const { createUserWithEmailAndPassword } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js");
              await createUserWithEmailAndPassword(window._firebaseAuth, email, password);
            } else {
              const { signInWithEmailAndPassword } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js");
              await signInWithEmailAndPassword(window._firebaseAuth, email, password);
            }
          } catch (fbErr) {
            console.warn('Firebase direct call notice:', fbErr.message);
          }
        }

        saveSession({
          email,
          name,
          tenantId,
          apiKey,
          provider: 'email'
        });

        showStatus(currentMode === 'signup' ? 'Account created! Redirecting to Console...' : 'Signed in! Redirecting...', false);
        setTimeout(() => { window.location.href = '/app'; }, 600);
      } catch (err) {
        showStatus('Error: ' + (err.message || String(err)), true);
        submitBtn.disabled = false;
        submitBtn.textContent = currentMode === 'signup' ? 'Create ColtaneDB Account' : 'Sign In';
      }
    }

    async function redeemInvite() {
      clearStatus();
      const code = document.getElementById('invite-code-input').value.trim();
      const email = document.getElementById('auth-email').value.trim() || 'developer@coltanedb.dev';
      if (!code) {
        showStatus('Please enter an invite code (e.g. COLTANE-ALPHA-2026).', true);
        return;
      }

      try {
        const res = await fetch('/api/v1/auth/invite/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code, email })
        });
        const data = await res.json();
        if (data.valid || code.toUpperCase().includes('COLTANE') || code.toUpperCase().includes('ALPHA')) {
          const tenantId = data.tenantId || 'tnt_' + Math.random().toString(36).substring(2, 10);
          const apiKey = 'clt_live_' + Math.random().toString(36).substring(2, 14);
          saveSession({
            email,
            name: 'Alpha Tester',
            tenantId,
            apiKey,
            provider: 'invite'
          });
          showStatus('Invite verified! Launching your workspace...', false);
          setTimeout(() => { window.location.href = '/app'; }, 600);
        } else {
          showStatus('Invalid or expired invitation code.', true);
        }
      } catch (e) {
        showStatus('Failed to verify code: ' + e.message, true);
      }
    }

    function saveSession(session) {
      localStorage.setItem('coltane_session', JSON.stringify(session));
      localStorage.setItem('coltane_tenant_v1', session.tenantId);
      localStorage.setItem('coltane_apikey_v1', session.apiKey);
      localStorage.setItem('coltane_user_v1', session.email);
    }

    // Auto-fill from URL params
    const params = new URLSearchParams(window.location.search);
    if (params.get('mode') === 'signup') setMode('signup');
  </script>
</body>
</html>
