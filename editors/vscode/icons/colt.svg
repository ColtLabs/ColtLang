<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="coltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3ecf8e"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3ecf8e" stop-opacity="0"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="#0d1117" stroke="#1f293d" stroke-width="2"/>
  <rect x="6" y="6" width="88" height="88" rx="22" fill="url(#glowGrad)"/>
  
  <!-- Colt Kinetic Bolt Glyph -->
  <g filter="url(#neonGlow)">
    <!-- Main Angular Lightning-Chevron -->
    <path d="M56 18 L28 52 L48 52 L40 82 L72 46 L52 46 Z" fill="url(#coltGrad)"/>
    <!-- Precision Core Highlight -->
    <path d="M53 26 L34 50 L47 50 L42 72 L64 48 L51 48 Z" fill="#ffffff" opacity="0.35"/>
  </g>
</svg>
