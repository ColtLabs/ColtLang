[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coltanedb"
version = "0.2.0"
description = "Official Python client and query SDK for ColtaneDB powered by the Meld Model"
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
authors = [
  { name = "Ayush Bhattacharya", email = "info.cometlabs@gmail.com" }
]
maintainers = [
  { name = "Ayush Bhattacharya", email = "info.cometlabs@gmail.com" }
]
keywords = [
  "colt",
  "coltlang",
  "coltanedb",
  "meld",
  "database",
  "query-language",
  "postgres",
  "redis",
  "mongodb",
  "vector",
  "sdk"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://coltanedb.vercel.app"
Documentation = "https://github.com/itsjustayush/ColtaneDB#readme"
Repository = "https://github.com/itsjustayush/ColtaneDB.git"
Issues = "https://github.com/itsjustayush/ColtaneDB/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["coltanedb*"]
